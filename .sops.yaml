# SOPS configuration for secret management
# This file defines who can decrypt which secrets

keys:
  # Your personal age key (for editing secrets)
  # Generate from SSH: ssh-to-age < ~/.ssh/id_ed25519.pub
  - &personal_age INSERT_YOUR_AGE_PUBLIC_KEY_HERE
  
  # WorkPC system key (for automated decryption)
  # Get from: ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub (on NixOS)
  # Or generate: age-keygen -o ~/.config/sops/age/workpc.txt
  - &workpc_system INSERT_WORKPC_AGE_KEY_HERE
  
  # WorkMac system key
  # - &workmac_system INSERT_WORKMAC_AGE_KEY_HERE

creation_rules:
  # Default rule for all secrets
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *personal_age
          # Uncomment when ready:
          # - *workpc_system
          # - *workmac_system

  # Per-host secrets (optional)
  - path_regex: secrets/workpc/.*\.yaml$
    key_groups:
      - age:
          - *personal_age
          # - *workpc_system

  - path_regex: secrets/workmac/.*\.yaml$
    key_groups:
      - age:
          - *personal_age
          # - *workmac_system
